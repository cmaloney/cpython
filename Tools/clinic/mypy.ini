[mypy]
files = Tools/clinic/
pretty = True

# make sure clinic can still be run on Python 3.10
python_version = 3.10

# and be strict!
strict = True
extra_checks = True
enable_error_code = ignore-without-code,redundant-expr,truthy-bool
warn_unreachable = True

# The pyspec runtime, partial evaluator and C emitter are not annotated yet.
[mypy-libclinic.pyspec.emit,libclinic.pyspec.partial_eval,libclinic.pyspec.runtime]
disallow_untyped_defs = False
disallow_incomplete_defs = False
disallow_untyped_calls = False
check_untyped_defs = False
