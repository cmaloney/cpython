[mypy]
files = Tools/clinic/
pretty = True

# make sure clinic can still be run on Python 3.10
python_version = 3.10

# and be strict!
strict = True
extra_checks = True
enable_error_code = ignore-without-code,redundant-expr,truthy-bool
warn_unreachable = True

# The pyspec partial evaluator, C emitter, call table and the
# disconnects checker are not annotated yet.
[mypy-libclinic.pyspec.call_table,libclinic.pyspec.disconnects,libclinic.pyspec.emit,libclinic.pyspec.partial_eval]
disallow_untyped_defs = False
disallow_incomplete_defs = False
disallow_untyped_calls = False
check_untyped_defs = False

# The facts analysis is annotated, but calls the partial evaluator and the
# table of builtin types, which are not yet.
[mypy-libclinic.pyspec.facts]
disallow_untyped_calls = False
